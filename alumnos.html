{% extends "base.html" %}
{% block titulo %}Alumnos{% endblock %}
{% block contenido %}
<h1 class="h3 text-lima">Mis alumnos</h1>
<div class="row g-3">
  <div class="col-lg-8">
    <form class="row g-2 mb-3" method="get">
      <div class="col-7"><input name="q" value="{{ q }}" class="form-control" placeholder="Buscar por nombre o usuario"></div>
      <div class="col-3"><select name="orden" class="form-select">
        <option value="nombre" {{ 'selected' if orden == 'nombre' }}>Nombre</option>
        <option value="usuario" {{ 'selected' if orden == 'usuario' }}>Usuario</option>
        <option value="id" {{ 'selected' if orden == 'id' }}>Antigüedad</option></select></div>
      <div class="col-2"><button class="btn btn-outline-light w-100">Ir</button></div>
    </form>
    <div class="card"><div class="table-responsive"><table class="table align-middle mb-0">
      <thead><tr><th>Nombre</th><th>Usuario</th><th class="text-end">Acciones</th></tr></thead>
      <tbody>
      {% for a in lista %}
        <tr><td>{{ a.nombre }}</td><td>{{ a.usuario }}</td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-info" href="{{ url_for('progreso', alumno_id=a.id) }}">Progreso</a>
            <a class="btn btn-sm btn-outline-light" href="{{ url_for('alumno_editar', alumno_id=a.id) }}">Editar</a>
            <form class="d-inline" method="post" action="{{ url_for('alumno_eliminar', alumno_id=a.id) }}"
                  onsubmit="return confirm('¿Eliminar a {{ a.nombre }} y TODAS sus rutinas?')">
              <button class="btn btn-sm btn-outline-danger">Eliminar</button></form>
          </td></tr>
      {% else %}<tr><td colspan="3" class="text-center py-4 text-secondary">Todavía no tenés alumnos.</td></tr>
      {% endfor %}
      </tbody></table></div></div>
  </div>
  <div class="col-lg-4">
    <div class="card p-3">
      <h2 class="h5">Nuevo alumno</h2>
      <form method="post" action="{{ url_for('alumno_nuevo') }}">
        <input name="nombre" class="form-control mb-2" placeholder="Nombre completo" required maxlength="80">
        <input name="usuario" class="form-control mb-2" placeholder="Usuario" required maxlength="30">
        <input name="password" type="password" class="form-control mb-2" placeholder="Contraseña (mín. 6)" required minlength="6">
        <button class="btn btn-lima w-100">Agregar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
